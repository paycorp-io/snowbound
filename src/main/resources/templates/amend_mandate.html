<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{template-three}">

<head>
    <title>Amend Mandate</title>
</head>

<body>
    <div layout:fragment="page-content-fragment" class="flex-grow-1 p-3">
        <h2>Amend Mandate</h2>
        <hr class="my-4">
        <form th:action="@{/mandate/amend}" method="post" class="row g-3">
            <div class="col-md-4">
                <label for="url" class="form-label">URL:</label>
                <input type="text" id="url" name="url" class="form-control" required>
              </div>
            <div class="col-md-4">
                <label for="apiKey" class="form-label">API Key:</label>
                <input type="text" id="apiKey" name="apiKey" class="form-control" required>
              </div>
            <div class="col-md-4">
                <label for="encryptionKey" class="form-label">Encryption Key:</label>
                <input type="text" id="encryptionKey" name="encryptionKey" class="form-control" required>
            </div>

            <div class="col-md-4">
                <label for="umrn" class="form-label">UMRN:</label>
                <input type="text" id="umrn" name="umrn" class="form-control" required>
            </div>

            <div class="col-md-4">
                <label for="utilityCode" class="form-label">Utility Code:</label>
                <input type="text" id="utilityCode" name="utilityCode" class="form-control" required>
            </div>

            <div class="col-md-4">
                <label for="referenceNumber" class="form-label">Reference Number:</label>
                <input type="text" id="referenceNumber" name="referenceNumber" class="form-control" required>
            </div>

            <div class="col-md-4">
                <label for="colltnAmt" class="form-label">Collection Amount:</label>
                <input type="number" id="colltnAmt" name="colltnAmt" class="form-control" required>
            </div>

            <div class="col-md-4">
                <label for="frqcy" class="form-label">Frequency:</label>
                <select id="frqcy" name="frqcy" class="form-control" required>
                  <option th:each="entry : ${frqcyMap}" th:value="${entry.key}" th:text="${entry.value}"></option>
                </select>
            </div>

            <div class="col-md-4">
                <label for="amountTp" class="form-label">Amount Type:</label>
                <select id="amountTp" name="amountTp" class="form-control" required>
                  <option th:each="entry : ${amountTpMap}" th:value="${entry.key}" th:text="${entry.value}"></option>
                </select>
            </div>

            <div class="col-md-4">
                <label for="categoryCode" class="form-label">category Code:</label>
                <select id="categoryCode" name="categoryCode" class="form-control" required>
                    <option th:each="entry : ${categoryCodeMap}" th:value="${entry.key}" th:text="${entry.value}"></option>
                </select>
            </div>

            <div class="col-md-4">
                <label for="firstCollectionDate" class="form-label">First Collection Date:</label>
                <input type="date" id="firstCollectionDate" name="firstCollectionDate" class="form-control" required>
              </div>
            <div class="col-md-4">
                <label for="finalCollectionDate" class="form-label">Final Collection Date:</label>
                <input type="date" id="finalCollectionDate" name="finalCollectionDate" class="form-control" required>
            </div>

            <div class="col-md-4">
                <label for="reasonCode" class="form-label">Reason Code:</label>
                <input type="text" id="reasonCode" name="reasonCode" class="form-control" required>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary">submit</button>
            </div>

            <div class="form-group">
                <label for="response">Response</label>
                <textarea class="form-control" id="response" rows="5" th:text="${response}" readonly></textarea>
            </div>
        </form>
    </div>

</body>
</html>
